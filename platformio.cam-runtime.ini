[platformio]
default_envs = cam-headless-runtime
[env:cam-headless-runtime]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = ports/cam/partitions.csv
board_upload.flash_size = 16MB
lib_ldf_mode = off
build_src_filter = -<*> +<main.cpp> +<runtime/boot/HeadlessRuntime.cpp>
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_LOOP_STACK_SIZE=16384
  -Wl,--wrap=nvs_flash_init
  -DRISCRTE_PROFILE_HEADLESS=1
  -Iports/cam
  -Isrc
  -Isdk/driver
  -Ilib/hal
  -Ilib/NativeApps/include
  -Ilib/elf_loader/include
  -Iports/cam/deps/sdfat
  -DELF_LOADER_VER_MAJOR=1
  -DELF_LOADER_VER_MINOR=3
  -DELF_LOADER_VER_PATCH=3
  -DCONFIG_ELF_LOADER=1
  -DCONFIG_ELF_DYNAMIC_LOAD_SHARED_OBJECT=1
  -DCONFIG_ELF_LOADER_LOAD_PSRAM=1
  -DCONFIG_ELF_LOADER_BUS_ADDRESS_MIRROR=1
  -DCONFIG_ELF_LOADER_CACHE_OFFSET=1
  -DCONFIG_ELF_LOADER_LIBC_SYMBOLS=1
  -DCONFIG_ELF_FILE_SYSTEM_BASE_PATH=\"/sd\"
extra_scripts = pre:ports/cam/build.py


[env:cam-headless-qualification]
extends = env:cam-headless-runtime
build_flags = ${env:cam-headless-runtime.build_flags} -DRISCRTE_CAM_QUALIFICATION=1

# Explicit one-shot lab deployment: ordinary ZIP install + generic capture.
# No camera code is linked into firmware; packages remain external ELFs.
[env:cam-camera-experiment]
extends = env:cam-headless-runtime
build_flags = ${env:cam-headless-runtime.build_flags} -DRISCRTE_CAM_CAMERA_EXPERIMENT=1
board_build.embed_files =
  dist/packages/driver-cam-ov3660-profile-0.1.0-xtensa-esp32s3.rte.zip
  dist/packages/driver-camera-esp32s3-ov3660-0.1.8-xtensa-esp32s3.rte.zip
