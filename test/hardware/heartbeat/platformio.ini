[platformio]
default_envs = cam-sd, cam-nosd, x4

[env]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
lib_ldf_mode = off
build_flags =
  -DRISCRTE_HEARTBEAT_VERSION=\"1.0.0\"
  -DARDUINO_USB_MODE=1

[env:cam-sd]
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0 -DRISCRTE_HEARTBEAT_TARGET=\"cam-sd\"

[env:cam-nosd]
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0 -DRISCRTE_HEARTBEAT_TARGET=\"cam-nosd\"

[env:x4]
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1 -DRISCRTE_HEARTBEAT_TARGET=\"x4\"
