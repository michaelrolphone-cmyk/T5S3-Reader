; Compile-only controller fixture. No setup(), loop(), upload, or board operation.
; This uses the same installed ESP32-S3 framework/compiler as the Reader build.
[platformio]
default_envs = bounded-controller

[env:bounded-controller]
platform = espressif32@6.13.0
platform_packages = platformio/framework-arduinoespressif32 @ 3.20017.241212+sha.dcc1105b
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
build_flags = -std=gnu++2a -fno-exceptions -fno-rtti -DBOARD_HAS_PSRAM -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11 -fexceptions
