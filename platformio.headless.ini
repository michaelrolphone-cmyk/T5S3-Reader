; Development checkpoint, not a complete provisioning/runtime image.
; pio run -c platformio.headless.ini -e esp32s3-core-check
[platformio]
default_envs = esp32s3-core-check

[env:esp32s3-core-check]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
lib_ldf_mode = off
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DRISCRTE_HEADLESS_CORE_CHECK
  -Ilib/NativeApps/include
  -Wl,--wrap=nvs_flash_init
extra_scripts = pre:scripts/headless_core_build.py
build_src_filter =
  -<*>
  +<runtime/boot/HeadlessCoreCheck.cpp>
  +<runtime/streams/StreamRuntime.cpp>
