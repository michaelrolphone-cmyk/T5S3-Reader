<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" role="img" aria-label="RiscRTE architecture: applications on top, then application framework, then runtime, splitting into service and driver ELFs, converging on ESP-IDF and FreeRTOS, running on supported hardware" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.14  0 0 0 0 0.13  0 0 0 0 0.12  0 0 0 0.05 0"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0.5,0.5 L9.5,5 L0.5,9.5 z" fill="#3E79B0"/>
    </marker>
  </defs>

  <!-- backdrop slab -->
  <rect x="4" y="4" width="712" height="772" rx="14" fill="#EFECE4"/>
  <rect x="4" y="4" width="712" height="772" rx="14" fill="none" stroke="#CFC9BC" stroke-width="1"/>
  <rect x="4" y="4" width="712" height="772" rx="14" filter="url(#grain)"/>

  <!-- title -->
  <text x="360" y="36" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="26" letter-spacing="-0.5" fill="#23211E">RiscRTE</text>
  <text x="360" y="54" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#7D786F">system architecture, top to bottom</text>

  <!-- connectors: main spine -->
  <line x1="360" y1="144" x2="360" y2="178" stroke="#3E79B0" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="360" y1="266" x2="360" y2="300" stroke="#3E79B0" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="360" y1="634" x2="360" y2="658" stroke="#3E79B0" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- connectors: branch from Runtime into Service/Driver ELFs -->
  <path d="M360,416 V426" stroke="#3E79B0" stroke-width="3" fill="none"/>
  <path d="M360,426 Q360,434 352,434 H198 Q190,434 190,442 V448" stroke="#3E79B0" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M360,426 Q360,434 368,434 H522 Q530,434 530,442 V448" stroke="#3E79B0" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- connectors: converge from Service/Driver ELFs into ESP-IDF -->
  <path d="M190,542 V550 Q190,558 198,558 H352 Q360,558 360,566" stroke="#3E79B0" stroke-width="3" fill="none"/>
  <path d="M530,542 V550 Q530,558 522,558 H368 Q360,558 360,566" stroke="#3E79B0" stroke-width="3" fill="none"/>
  <path d="M360,566 V574" stroke="#3E79B0" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Box A: Applications / Scene Controllers -->
  <rect x="40" y="60" width="640" height="84" rx="8" fill="#ABA59B"/>
  <text x="360" y="90" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="19" fill="#23211E">Applications / Scene Controllers</text>
  <text x="360" y="124" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" fill="#3A362F">Reader | File Browser | Settings | Programmer | Apps</text>

  <!-- Box B: Application Framework -->
  <rect x="40" y="182" width="640" height="84" rx="8" fill="#7D786F"/>
  <text x="360" y="212" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="19" fill="#F1EEE7">RiscRTE Application Framework</text>
  <text x="360" y="246" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" fill="#E4E0D6">UI | Navigation | Input | Files | Network | Power | Events</text>

  <!-- Box C: Runtime -->
  <rect x="40" y="304" width="640" height="112" rx="8" fill="#23211E"/>
  <text x="360" y="332" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="19" fill="#F1EEE7">RiscRTE Runtime</text>
  <text x="360" y="362" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13.5" fill="#C9C4B9">ELF loader | capability resolver | resource ownership</text>
  <text x="360" y="386" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13.5" fill="#C9C4B9">service manager | driver manager | security | memory</text>

  <!-- Box D: Service ELFs -->
  <rect x="40" y="448" width="300" height="94" rx="8" fill="#7D786F"/>
  <text x="190" y="476" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="16" fill="#F1EEE7">Service ELFs</text>
  <text x="190" y="502" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5" fill="#E4E0D6">time | alarm</text>
  <text x="190" y="522" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5" fill="#E4E0D6">updater | ...</text>

  <!-- Box E: Driver ELFs -->
  <rect x="380" y="448" width="300" height="94" rx="8" fill="#7D786F"/>
  <text x="530" y="476" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="16" fill="#F1EEE7">Driver ELFs</text>
  <text x="530" y="502" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5" fill="#E4E0D6">GPS | USB</text>
  <text x="530" y="522" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5" fill="#E4E0D6">hardware | ...</text>

  <!-- ESP-IDF / FreeRTOS -->
  <rect x="40" y="574" width="640" height="60" rx="8" fill="#3E79B0"/>
  <text x="360" y="611" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#F4F7FA">ESP-IDF / FreeRTOS</text>

  <!-- Supported hardware -->
  <rect x="40" y="658" width="640" height="56" rx="8" fill="#23211E"/>
  <rect x="40" y="658" width="640" height="56" rx="8" filter="url(#grain)"/>
  <text x="360" y="692" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#F1EEE7">Supported hardware</text>

</svg>
