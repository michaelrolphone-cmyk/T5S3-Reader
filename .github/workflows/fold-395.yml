name: Fold 395 into rollup
on:
  workflow_dispatch:
  push:
    branches: [fix/consolidated-bugs-20261003-c]
    paths:
      - '.github/workflows/fold-395.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consolidated-bugs-20261003-c
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fold #395 BUG-239
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if grep -q 'tryGetAdvance' lib/EpdFont/SdCardFont.h \
             && grep -q 'version = 1.3.103' platformio.ini \
             && test -f docs/bugfix/BUG-239.md \
             && test -f test/font_metrics/advance_cache_test.py; then
            echo "BUG-239 already on rollup; cleaning workflow only"
            rm -f .github/workflows/fold-395.yml
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "temp: remove fold-395 one-shot workflow"
              git push origin HEAD:fix/consolidated-bugs-20261003-c
            fi
            exit 0
          fi

          git fetch origin fix/bug239-font-advance-cache-miss
          SRC=22532143d345d964c1e2be3e109ef4d109ceecc3
          set +e
          git cherry-pick "$SRC"
          cp_status=$?
          set -e
          if test "$cp_status" -ne 0; then
            if grep -q '<<<<<<' platformio.ini; then
              python3 -c "import re; from pathlib import Path; p=Path('platformio.ini'); t=p.read_text(); t2,n=re.subn(r'<<<<<<< HEAD\nversion = [^\n]+\n=======\nversion = 1\.3\.103\n>>>>>>> [^\n]+\n','version = 1.3.103\n',t,count=1); assert n==1 and '<<<<<<<' not in t2, repr(t[:400]); p.write_text(t2)"
              git add platformio.ini
              GIT_EDITOR=true git cherry-pick --continue
            else
              echo "Cherry-pick failed without expected platformio conflict" >&2
              git status
              exit 1
            fi
          else
            sed -i -E 's/^version = 1\.3\.[0-9]+$/version = 1.3.103/' platformio.ini
            if ! git diff --quiet platformio.ini; then
              git add platformio.ini
              git commit --amend --no-edit
            fi
          fi

          grep -q 'version = 1.3.103' platformio.ini
          grep -q 'tryGetAdvance' lib/EpdFont/SdCardFont.h
          grep -q 'sdCardAdvance' lib/GfxRenderer/GfxRenderer.cpp
          test -f docs/bugfix/BUG-239.md
          test -f test/font_metrics/advance_cache_test.py
          grep -q 'advance_cache_test.py' test/run_fontawesome_test.sh

          rm -f .github/workflows/fold-395.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "temp: remove fold-395 one-shot workflow"
          fi
          git push origin HEAD:fix/consolidated-bugs-20261003-c
          echo "Pushed $(git rev-parse HEAD)"
