name: Fold 385 remaining Epub CssParser
on:
  push:
    branches: [fix/consolidated-bugs-20261003-c]
    paths:
      - '.github/workflows/fold-385-remaining.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consolidated-bugs-20261003-c
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply remaining Epub and CssParser patch
        run: |
          set -euo pipefail
          PATCH=".consolidation/fold-385-remaining.patch"
          if [ ! -f "$PATCH" ]; then
            echo "Patch already applied; nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply "$PATCH"
          rm -f "$PATCH"
          rm -f .github/workflows/fold-385-remaining.yml
          rm -f .github/workflows/fold-385-finish.yml
          rm -f .fold-encoding-probe.txt
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Fold #385: wire Epub.cpp and CssParser to rendition_v1 cache paths"
          git push origin HEAD:fix/consolidated-bugs-20261003-c
