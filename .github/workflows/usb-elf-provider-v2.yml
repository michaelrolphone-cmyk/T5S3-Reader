name: Experimental USB ELF Provider v2

on:
  pull_request:
    paths:
      - "Drivers/usb_cdc_v2/**"
      - "Drivers/usb_cp210x_v2/**"
      - "sdk/driver/RiscProviderV2.h"
      - "sdk/driver/RiscUsbProviderV1.h"
      - "src/runtime/drivers/ProviderModuleV2.*"
      - "src/runtime/drivers/ProviderGraphV2.*"
      - "scripts/build_usb_cdc_v2.py"
      - "scripts/build_usb_cp210x_v2.py"
      - "test/drivers/usb_cdc_v2*.c"
      - "test/drivers/usb_cp210x_v2*.c"
      - "test/drivers/provider*.cpp"
      - "test/run_usb_cdc_v2_test.sh"
      - "test/run_usb_cp210x_v2_test.sh"
      - "test/run_provider_graph_v2_test.sh"
      - "test/run_usb_provider_stack_v2_test.sh"
      - ".github/workflows/usb-elf-provider-v2.yml"
  workflow_dispatch:

jobs:
  build-experimental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exercise independent USB class ELFs against mocked host ABI
        run: |
          bash test/run_usb_cdc_v2_test.sh
          bash test/run_usb_cp210x_v2_test.sh
      - name: Install PlatformIO and target toolchain
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install -e t5s3-pro
      - name: Build experimental Xtensa class providers (not published)
        run: |
          python scripts/build_usb_cdc_v2.py
          bash test/run_native_app_test.sh dist/experimental/usb-cdc-acm-v2/driver.elf
          python scripts/build_usb_cp210x_v2.py
          bash test/run_native_app_test.sh dist/experimental/usb-cp210x-v2/driver.elf
      - name: Preserve experimental binaries for inspection only
        uses: actions/upload-artifact@v4
        with:
          name: usb-v2-class-elves-experimental-not-for-install
          path: dist/experimental/usb-*/
          if-no-files-found: error
