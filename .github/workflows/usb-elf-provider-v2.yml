name: Experimental USB ELF Provider v2

on:
  pull_request:
    paths:
      - "Drivers/usb_cdc_v2/**"
      - "Drivers/usb_cp210x_v2/**"
      - "Drivers/usb_host_v2/**"
      - "Drivers/usb_controller_esp32s3/**"
      - "Drivers/board_power_t5s3_v2/**"
      - "Drivers/i2c_esp32s3_v2/**"
      - "Drivers/platform_clock_v1/**"
      - "sdk/driver/RiscProviderV2.h"
      - "sdk/driver/RiscUsbProviderV1.h"
      - "sdk/driver/RiscUsbControllerV1.h"
      - "sdk/driver/RiscUsbVbusV1.h"
      - "sdk/driver/RiscI2cBusV1.h"
      - "sdk/driver/RiscPlatformClockV1.h"
      - "lib/elf_loader/**"
      - "lib/NativeApps/src/NativeAppLauncher.c"
      - "src/runtime/drivers/**"
      - "src/runtime/packages/**"
      - "src/native/NativeUsbBridge.cpp"
      - "scripts/native_app_symbols.py"
      - "scripts/generate_privileged_imports_v1.py"
      - "scripts/generate_provider_package_inputs_v1.py"
      - "scripts/build_installed_usb_stack.py"
      - "scripts/build_usb_cdc_v2.py"
      - "scripts/build_usb_cp210x_v2.py"
      - "scripts/build_usb_host_v2.py"
      - "scripts/build_board_power_t5s3_v2.py"
      - "scripts/build_platform_clock_v1.py"
      - "scripts/probe_usb_controller_esp32s3.py"
      - "scripts/probe_i2c_esp32s3_v2.py"
      - "scripts/audit_usb_controller_elf.py"
      - "scripts/audit_i2c_esp32s3_elf.py"
      - "test/drivers/usb_cdc_v2*.c"
      - "test/drivers/usb_cp210x_v2*.c"
      - "test/drivers/usb_host_v2*.c"
      - "test/drivers/board_power_t5s3_v2_test.c"
      - "test/drivers/i2c_esp32s3_v2_test.c"
      - "test/drivers/platform_clock_v1_test.c"
      - "test/drivers/privileged_*"
      - "test/drivers/provider_package_inputs_v1_test.py"
      - "test/drivers/stub_os_cpu/**"
      - "test/drivers/stub_privileged_loader/**"
      - "test/drivers/mock_i2c_bus_elf_v2.c"
      - "test/drivers/vbus_provider_chain_v2_test.cpp"
      - "test/drivers/provider*.cpp"
      - "test/run_usb_cdc_v2_test.sh"
      - "test/run_usb_cp210x_v2_test.sh"
      - "test/run_usb_host_v2_test.sh"
      - "test/run_board_power_t5s3_v2_test.sh"
      - "test/run_i2c_esp32s3_v2_test.sh"
      - "test/run_platform_clock_v1_test.sh"
      - "test/run_privileged_os_cpu_v1_test.sh"
      - "test/run_privileged_elf_snapshot_v1_test.sh"
      - "test/run_vbus_provider_chain_v2_test.sh"
      - "test/run_provider_graph_v2_test.sh"
      - "test/run_usb_provider_stack_v2_test.sh"
      - ".github/workflows/usb-elf-provider-v2.yml"
  workflow_dispatch:

jobs:
  build-experimental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exercise OS/CPU scope, native digest snapshot and provider graph
        run: |
          bash test/run_privileged_os_cpu_v1_test.sh
          bash test/run_privileged_elf_snapshot_v1_test.sh
          bash test/run_provider_graph_v2_test.sh
          bash test/run_usb_cdc_v2_test.sh
          bash test/run_usb_cp210x_v2_test.sh
          bash test/run_board_power_t5s3_v2_test.sh
          bash test/run_i2c_esp32s3_v2_test.sh
          bash test/run_platform_clock_v1_test.sh
          bash test/run_vbus_provider_chain_v2_test.sh
      - name: Install PlatformIO and target toolchain
        run: |
          python -m pip install platformio==6.1.19 pyelftools
          pio pkg install -e t5s3-pro
      - name: Compile physical controller and link PIC IDF USB implementation into ELF
        run: python scripts/probe_usb_controller_esp32s3.py --link-experiment
      - name: Audit physical ELF imports and exact loader relocation support
        run: |
          python scripts/audit_usb_controller_elf.py --strict
          bash test/run_native_app_test.sh dist/experimental/usb-controller-esp32s3/controller-link-experiment.elf
      - name: Build physical I2C controller and PIC IDF I2C/GPIO implementation
        run: |
          python scripts/probe_i2c_esp32s3_v2.py
          python scripts/audit_i2c_esp32s3_elf.py --strict
          bash test/run_native_app_test.sh dist/experimental/i2c-esp32s3-v2/driver.elf
      - name: Build Xtensa provider ELFs
        run: |
          python scripts/build_usb_cdc_v2.py
          bash test/run_native_app_test.sh dist/experimental/usb-cdc-acm-v2/driver.elf
          python scripts/build_usb_cp210x_v2.py
          bash test/run_native_app_test.sh dist/experimental/usb-cp210x-v2/driver.elf
          python scripts/build_usb_host_v2.py
          bash test/run_native_app_test.sh dist/experimental/usb-host-v2/driver.elf
          python scripts/build_board_power_t5s3_v2.py
          bash test/run_native_app_test.sh dist/experimental/usb-board-power-t5s3-v2/driver.elf
          python scripts/build_platform_clock_v1.py
          python scripts/audit_usb_controller_elf.py dist/experimental/platform-clock-v1/driver.elf --strict
          bash test/run_native_app_test.sh dist/experimental/platform-clock-v1/driver.elf
      - name: Validate private C ABI and exact import matcher against physical linked ELFs
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Itest/drivers/stub_os_cpu -Ilib/elf_loader/include \
            lib/elf_loader/src/esp_privileged_imports.c \
            test/drivers/privileged_imports_v1_cli.c -o /tmp/riscrte-privileged-imports-ci
          cc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Itest/drivers/stub_os_cpu -Ilib/elf_loader/include \
            lib/elf_loader/src/esp_privileged_imports.c \
            lib/elf_loader/src/esp_privileged_manifest_imports.c \
            test/drivers/privileged_manifest_imports_v1_cli.c -o /tmp/riscrte-exact-imports-ci
          /tmp/riscrte-privileged-imports-ci \
            dist/experimental/usb-controller-esp32s3/controller-link-experiment.elf \
            dist/experimental/i2c-esp32s3-v2/driver.elf \
            dist/experimental/platform-clock-v1/driver.elf
          for elf in \
            dist/experimental/usb-controller-esp32s3/controller-link-experiment.elf \
            dist/experimental/i2c-esp32s3-v2/driver.elf \
            dist/experimental/platform-clock-v1/driver.elf; do
            python scripts/generate_privileged_imports_v1.py "$elf"
            /tmp/riscrte-exact-imports-ci "$elf" "$(dirname "$elf")/privileged-imports.v1"
          done
          python test/drivers/privileged_real_elf_import_negative_v1.py \
            /tmp/riscrte-exact-imports-ci \
            dist/experimental/usb-controller-esp32s3/controller-link-experiment.elf \
            dist/experimental/i2c-esp32s3-v2/driver.elf \
            dist/experimental/platform-clock-v1/driver.elf
          python test/drivers/provider_package_inputs_v1_test.py
      - name: Assemble and inspect canonical provider package delivery
        run: |
          python scripts/build_installed_usb_stack.py
          python test/drivers/installed_usb_stack_package_test.py
      - name: Preserve installable unsigned package directories and experimental binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usb-v2-elves-and-canonical-packages-unqualified-for-board
          path: |
            dist/experimental/usb-*/
            dist/experimental/i2c-*/
            dist/experimental/platform-clock-v1/
            dist/packages/
          if-no-files-found: warn
