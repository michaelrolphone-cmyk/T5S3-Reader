name: Fold 401 and 403 into rollup
on:
  workflow_dispatch:
  push:
    branches: [fix/consolidated-bugs-20261003-c]
    paths:
      - '.github/workflows/fold-401-403-simple.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consolidated-bugs-20261003-c
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply folds
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if grep -q 'version = 1.3.113' platformio.ini \
             && test -f docs/BUG179_XTC_METADATA_REPAIR.md \
             && test -f docs/bugfix/BUG-44.md \
             && grep -q 'run_xtc_metadata_test.sh' test/run_springboard_test.sh \
             && grep -q 'Verify OPDS reload failure' .github/workflows/platformio-build.yml; then
            echo "Already folded"
            rm -f .github/workflows/fold-401-403.yml .github/workflows/fold-401-403-simple.yml .rollup/fold-401-403-probe.txt
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "temp: cleanup fold-401-403 helpers"
              git push origin HEAD:fix/consolidated-bugs-20261003-c
            fi
            exit 0
          fi

          git fetch origin fix/bug179-xtc-metadata-offset fix/bug44-opds-stale-reload
          SRC401=4a4b20c2819fb9d61bf45918caf9377c02e034eb
          SRC403=d707533fbce61dcaa2cb6786b3175932709cb0a1

          git checkout "$SRC401" -- \
            docs/BUG179_XTC_METADATA_REPAIR.md \
            lib/Xtc/Xtc/XtcParser.cpp \
            lib/Xtc/Xtc/XtcParser.h \
            test/run_xtc_metadata_test.sh \
            test/xtc_metadata/metadata_test.cpp \
            test/xtc_metadata/stubs/FsHelpers.h \
            test/xtc_metadata/stubs/HalStorage.h \
            test/xtc_metadata/stubs/Logging.h

          git checkout "$SRC403" -- \
            docs/bugfix/BUG-44.md \
            .github/workflows/platformio-build.yml \
            src/OpdsServerStore.cpp \
            src/native/NativeOpdsBridge.cpp \
            test/native_bridges/opds_url_admission_test.cpp \
            test/opds_reload/README.md \
            test/opds_reload/reload_test.cpp \
            test/opds_reload/reload_test.py \
            test/opds_reload/stubs/CrossPointSettings.h \
            test/opds_reload/stubs/HalStorage.h \
            test/opds_reload/stubs/JsonSettingsIO.h \
            test/opds_reload/stubs/Logging.h

          sed -i -E 's/^version = 1\.3\.[0-9]+$/version = 1.3.113/' platformio.ini

          if ! grep -q 'run_xtc_metadata_test.sh' test/run_springboard_test.sh; then
            sed -i '/run_language_migration_test.sh/a XTC_SANITIZE=1 bash "$repo_dir/test/run_xtc_metadata_test.sh"' test/run_springboard_test.sh
          fi

          chmod +x test/run_xtc_metadata_test.sh

          grep -q 'version = 1.3.113' platformio.ini
          grep -q 'run_xtc_metadata_test.sh' test/run_springboard_test.sh
          grep -q 'run_language_migration_test.sh' test/run_springboard_test.sh
          grep -q 'Verify OPDS reload failure' .github/workflows/platformio-build.yml
          grep -q 'servers.clear()' src/OpdsServerStore.cpp
          grep -q 'metadataOffset' lib/Xtc/Xtc/XtcParser.cpp
          grep -q '1.1.47' Apps/hollow_trail.json
          grep -q 'BOOK_CACHE_VERSION = 11' lib/Epub/Epub/BookMetadataCache.cpp

          rm -f .github/workflows/fold-401-403.yml .github/workflows/fold-401-403-simple.yml .rollup/fold-401-403-probe.txt
          git add -A
          git commit -m "Fold #401 BUG-179 and #403 BUG-44 into rollup (firmware 1.3.113)"
          git push origin HEAD:fix/consolidated-bugs-20261003-c
          echo "Pushed $(git rev-parse HEAD)"
          git log --oneline -5
