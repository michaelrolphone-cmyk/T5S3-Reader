name: Fold 390 and 391 into rollup
on:
  push:
    branches: [fix/consolidated-bugs-20261003-c]
    paths:
      - '.github/workflows/fold-390-391.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consolidated-bugs-20261003-c
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge #390 and #391 into rollup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SRC390=19aaa2b46d47e82a733c5cd5b9c3043132fa6c09
          SRC391=f01da5c62b09324d0bc249e31762d95f0b513453

          if git merge-base --is-ancestor "$SRC390" HEAD && git merge-base --is-ancestor "$SRC391" HEAD; then
            echo "Both source heads already ancestors; cleaning workflow only"
            rm -f .github/workflows/fold-390-391.yml
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "temp: remove fold-390-391 one-shot workflow"
              git push origin HEAD:fix/consolidated-bugs-20261003-c
            fi
            exit 0
          fi

          git fetch origin fix/hollow-trail-cab-step-plant fix/bug67-opds-relative-urls

          if ! git merge-base --is-ancestor "$SRC390" HEAD; then
            git merge --no-ff origin/fix/hollow-trail-cab-step-plant \
              -m "Fold #390: restore Hollow Trail locomotive cab-step plant (app 1.1.47)"
          fi

          if ! git merge-base --is-ancestor "$SRC391" HEAD; then
            set +e
            git merge --no-ff origin/fix/bug67-opds-relative-urls \
              -m "Fold #391 BUG-67: OPDS relative URL resolution (firmware 1.3.96)"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              if git diff --name-only --diff-filter=U | grep -qx platformio.ini; then
                git checkout --theirs platformio.ini
                # Force highest required firmware version
                sed -i -E 's/^version = .*/version = 1.3.96/' platformio.ini
                git add platformio.ini
              fi
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "Unresolved conflicts remain:"
                git diff --name-only --diff-filter=U
                exit 1
              fi
              git commit --no-edit -m "Fold #391 BUG-67: OPDS relative URL resolution (firmware 1.3.96)"
            fi
          fi

          # Ensure required versions even if merge was clean with wrong side
          sed -i -E 's/^version = .*/version = 1.3.96/' platformio.ini
          if ! grep -q '"version": "1.1.47"' Apps/hollow_trail.json; then
            echo "ERROR: hollow_trail app version not 1.1.47"
            exit 1
          fi
          git add platformio.ini
          if ! git diff --cached --quiet; then
            git commit -m "Rollup: keep firmware 1.3.96 after #390/#391 fold"
          fi

          rm -f .github/workflows/fold-390-391.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "temp: remove fold-390-391 one-shot workflow"
          fi

          grep -q 'version = 1.3.96' platformio.ini
          grep -q '"version": "1.1.47"' Apps/hollow_trail.json
          grep -q 'BOOK_CACHE_VERSION = 11' lib/Epub/Epub/BookMetadataCache.cpp
          grep -q 'ht_detail_leaf' Apps/hollow_trail_geography_draw.inc
          grep -q 'removeDotSegments' src/util/UrlUtils.cpp
          test -f docs/bugfix/BUG-67.md
          test -f docs/images/hollow-trail-cab-step/README.md
          test -f test/util/url_resolution_test.py

          git push origin HEAD:fix/consolidated-bugs-20261003-c
          echo "Pushed $(git rev-parse HEAD)"
