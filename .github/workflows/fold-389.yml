name: Fold 389 into rollup
# fold-389 v7 inline
on:
  push:
    branches: [fix/consolidated-bugs-20261003-c]
    paths:
      - '.github/workflows/fold-389.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consolidated-bugs-20261003-c
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fold #389 BUG-173
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/bug173-epub-toc-extraction
          B=cff6ef0c11b79634dfa2c688d880df393d8c153c
          T=3ddcff7acc7a8b0aa64bef336761c3ffb5648445
          git checkout "$T" -- docs/bugfix/BUG-173.md test/epub_toc/path_test.cpp test/epub_toc/path_test.py test/epub_toc/reset_test.cpp lib/Epub/Epub/BookMetadataCache.h
          # Epub.cpp three-way (clean)
          git show "$B:lib/Epub/Epub.cpp" > /tmp/b
          git show HEAD:lib/Epub/Epub.cpp > /tmp/o
          git show "$T:lib/Epub/Epub.cpp" > /tmp/t
          git merge-file -p /tmp/o /tmp/b /tmp/t > lib/Epub/Epub.cpp
          grep -q ContentCachePaths lib/Epub/Epub.cpp
          grep -q resetTocEntries lib/Epub/Epub.cpp
          # BMC three-way + resolve version conflict
          git show "$B:lib/Epub/Epub/BookMetadataCache.cpp" > /tmp/b
          git show HEAD:lib/Epub/Epub/BookMetadataCache.cpp > /tmp/o
          git show "$T:lib/Epub/Epub/BookMetadataCache.cpp" > /tmp/t
          git merge-file -p /tmp/o /tmp/b /tmp/t > /tmp/m || true
          python3 -c "import re;t=open('/tmp/m').read();t,n=re.subn(r'<<<<<<< .*?\\n.*?=======\\n.*?>>>>>>> [^\\n]*\\n','// Generation 11 (#389 BUG-173); supersedes gens 8-10.\\nconstexpr uint8_t BOOK_CACHE_VERSION = 11;\\n',t,count=1,flags=re.S);assert n==1 and '<<<<<<<' not in t;open('lib/Epub/Epub/BookMetadataCache.cpp','w').write(t)"
          grep -q 'BOOK_CACHE_VERSION = 11' lib/Epub/Epub/BookMetadataCache.cpp
          grep -q resetTocEntries lib/Epub/Epub/BookMetadataCache.cpp
          # guide_test: bump acceptance to gen 11 in place
          python3 -c "
          p='test/epub_guide/guide_test.cpp'
          t=open(p).read()
          t=t.replace('for (uint8_t version : {5, 6, 7, 8, 9, 10})', 'for (uint8_t version : {5, 6, 7, 8, 9, 10, 11})')
          t=t.replace('version == 10', 'version == 11')
          t=t.replace('version != 10', 'version != 11')
          t=t.replace('cache generations 5-10 passed', 'cache generations 5-11 passed')
          assert 'version == 11' in t and 'current author restored' in t
          open(p,'w').write(t)
          "
          sed -i -E 's/^version = .*/version = 1.3.94/' platformio.ini
          rm -rf .fold-staging .github/workflows/fold-389.yml
          git add -A
          git diff --cached --quiet && { echo nothing; exit 0; }
          git commit -m "Fold #389 BUG-173: preserve NCX fallback when EPUB TOC extraction fails"
          git push origin HEAD:fix/consolidated-bugs-20261003-c
          echo Pushed $(git rev-parse HEAD)
