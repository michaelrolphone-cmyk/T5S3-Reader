name: Fold 389 into rollup
on:
  push:
    branches: [fix/consolidated-bugs-20261003-c]
    paths:
      - '.github/workflows/fold-389.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consolidated-bugs-20261003-c
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply staged #389 patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f .fold-staging/fold-389.patch
          git apply --index .fold-staging/fold-389.patch
          rm -rf .fold-staging .github/workflows/fold-389.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Fold #389 BUG-173: preserve NCX fallback when EPUB TOC extraction fails"
          git push origin HEAD:fix/consolidated-bugs-20261003-c
          echo "Pushed $(git rev-parse HEAD)"
          grep -q 'version = 1.3.94' platformio.ini
          grep -q 'BOOK_CACHE_VERSION = 11' lib/Epub/Epub/BookMetadataCache.cpp
          test -f docs/bugfix/BUG-173.md
          test -f test/epub_toc/reset_test.cpp
