name: Native SDK 6.1 shared components
on:
  pull_request:
  push:
    branches: [master, work/native-idf-6.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-components:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ELF inspection dependency
        run: python -m pip install pyelftools==0.32
      - name: Verify source-only promotion and standalone package routing
        run: |
          python -B test/source_only_promotion_test.py
          python -B test/bulk_release_test.py
      - name: Install SDK 6.1 compiler only, without Arduino or PlatformIO
        shell: bash
        run: |
          set -euo pipefail
          echo "PLATFORMIO_CORE_DIR=$RUNNER_TEMP/unused-platformio" >> "$GITHUB_ENV"
          # ESP-IDF fff9895c82d744c7237be8847347bdd1b07c6643 tools/tools.json.
          archive="$RUNNER_TEMP/xtensa-esp-elf.tar.xz"
          curl --fail --location --retry 3 -o "$archive" https://github.com/espressif/crosstool-NG/releases/download/esp-15.2.0_20251204/xtensa-esp-elf-15.2.0_20251204-x86_64-linux-gnu.tar.xz
          echo "3d50f5cd5f173acfd524e07c1cd69bc99585731a415ca2e5bce879997fe602b8  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/native-sdk61"
          tar -xJf "$archive" -C "$RUNNER_TEMP/native-sdk61"
          echo "$RUNNER_TEMP/native-sdk61/xtensa-esp-elf/bin" >> "$GITHUB_PATH"
      - name: Verify target frontend and exact compiler
        shell: bash
        run: |
          set -euo pipefail
          xtensa-esp32s3-elf-gcc --version | grep 'esp-15.2.0_20251204'
          xtensa-esp32s3-elf-gcc -dM -E -xc /dev/null > "$RUNNER_TEMP/target-macros"
          grep -Fx '#define __XTENSA_EL__ 1' "$RUNNER_TEMP/target-macros"
          grep -Fx '#define __XCHAL_HAVE_FP 1' "$RUNNER_TEMP/target-macros"
      - name: Check out pinned native IDF headers only
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: fff9895c82d744c7237be8847347bdd1b07c6643
          path: .source/esp-idf
          persist-credentials: false
          sparse-checkout: |
            components/esp_common/include
            components/esp_hw_support/include
            components/esp_hw_support/etm/include
            components/esp_driver_gpio/include
            components/esp_hal_gpio/include
            components/esp_hal_gpio/esp32s3/include
            components/esp_hal_usb/include
            components/esp_hal_usb/esp32s3/include
            components/hal/include
            components/hal/platform_port/include
            components/soc/include
            components/soc/esp32s3
            components/esp_rom/include
            components/esp_rom/esp32s3
            components/esp_system/include
      - name: Check out pinned upstream TinyUSB source only
        uses: actions/checkout@v4
        with:
          repository: hathach/tinyusb
          ref: 1eb6ce784ca9b8acbbe43dba9f1d9c26c2e80eb0
          path: .source/tinyusb
          persist-credentials: false
          sparse-checkout: src
      - name: Qualify selected ordinary MSC with native headers
        shell: bash
        run: |
          set -euo pipefail
          export IDF_PATH="$GITHUB_WORKSPACE/.source/esp-idf"
          export TINYUSB_SOURCE="$GITHUB_WORKSPACE/.source/tinyusb"
          export NATIVE_MSC_INTEGRATION=1
          export NATIVE_MSC_ELF_VALIDATOR="$RUNNER_TEMP/validate-msc-elf"
          export ASAN_OPTIONS=detect_leaks=0
          cc -std=c11 -Wall -Wextra -Werror -Itest/native_apps/stubs -Ilib/elf_loader/include lib/elf_loader/src/esp_elf_validate.c test/native_apps/validate_test.c -o "$NATIVE_MSC_ELF_VALIDATOR"
          python -m unittest discover -s test -p test_native_msc_sdk.py -v
          bash test/run_usb_device_msc_test.sh
          SANITIZE=1 bash test/run_usb_device_msc_test.sh
          python test/run_usb_msc_transport_test.py --soc-include "$IDF_PATH/components/soc/esp32s3/register"
          SANITIZE=1 python test/run_usb_msc_transport_test.py --soc-include "$IDF_PATH/components/soc/esp32s3/register"
          python scripts/build_usb_device_msc.py --tinyusb "$TINYUSB_SOURCE" --validator "$NATIVE_MSC_ELF_VALIDATOR" --output build/msc-native
      - name: Test compiler discovery and generic driver contracts
        run: |
          python test/native_toolchain_test.py -v
          bash test/run_driver_test.sh
          bash test/run_platform_clock_v1_test.sh
          cc -std=c11 -Wall -Wextra -Werror -D_DEFAULT_SOURCE -Isdk/compat/elf-time32 -Isdk/driver Drivers/platform_clock_v1/driver.c test/drivers/platform_clock_v1_test.c -o "$RUNNER_TEMP/clock-time32"
          "$RUNNER_TEMP/clock-time32"
      - name: Build shared apps and generic drivers independently of firmware
        run: |
          python scripts/build_native_app.py examples/native_apps/hello.c --output dist/sdk61/hello.elf
          bash test/run_native_app_test.sh dist/sdk61/hello.elf
          python scripts/build_all_apps.py --id timecard
          python scripts/build_all_apps.py --id camera_utility
          python scripts/build_driver.py
          bash test/run_native_app_test.sh dist/drivers/gps-nmea/driver.elf
          python scripts/build_platform_clock_v1.py
          bash test/run_native_app_test.sh dist/experimental/platform-clock-v1/driver.elf
          python scripts/build_usb_host_v2.py
          bash test/run_native_app_test.sh dist/experimental/usb-host-v2/driver.elf
          python scripts/build_usb_hid.py
          bash test/run_native_app_test.sh dist/experimental/usb-hid/driver.elf
      - uses: actions/upload-artifact@v4
        with:
          name: t5-shared-sdk61-development-${{ github.sha }}
          path: |
            build/msc-native/
            dist/apps/
            dist/sdk61/
            dist/drivers/
            dist/experimental/platform-clock-v1/
            dist/experimental/usb-host-v2/
            dist/experimental/usb-hid/
          if-no-files-found: error
          retention-days: 7
