name: Fold 387 388 into rollup
on:
  push:
    branches: [fix/consolidated-bugs-20261003-c]
    paths:
      - '.github/workflows/fold-387-388.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consolidated-bugs-20261003-c
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply #387 and #388 blobs then bump firmware
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          U1=https://raw.githubusercontent.com/michaelrolphone-cmyk/T5S3-Reader/a383c65169afad73ccfaa0cee47d53d747a65953
          NTP=https://raw.githubusercontent.com/michaelrolphone-cmyk/T5S3-Reader/ef6bbf74eae72d23686545c4b504dc718bed3d41

          mkdir -p docs/bugfix \
            src/runtime/drivers \
            src/runtime/packages \
            test/clock_sync \
            test/provider_enumeration/stubs/freertos \
            test/resources/cdc_sd_stubs

          curl -fsSL "$U1/docs/U1_PROVIDER_ENUMERATION_PERFORMANCE.md" -o docs/U1_PROVIDER_ENUMERATION_PERFORMANCE.md
          curl -fsSL "$U1/src/runtime/drivers/InstalledProviderGraph.cpp" -o src/runtime/drivers/InstalledProviderGraph.cpp
          curl -fsSL "$U1/src/runtime/drivers/InstalledProviderGraph.h" -o src/runtime/drivers/InstalledProviderGraph.h
          curl -fsSL "$U1/src/runtime/packages/PackageCdcSdMigration.cpp" -o src/runtime/packages/PackageCdcSdMigration.cpp
          curl -fsSL "$U1/test/provider_enumeration/README.md" -o test/provider_enumeration/README.md
          curl -fsSL "$U1/test/provider_enumeration/cases.cpp" -o test/provider_enumeration/cases.cpp
          curl -fsSL "$U1/test/provider_enumeration/prefix.cpp" -o test/provider_enumeration/prefix.cpp
          curl -fsSL "$U1/test/provider_enumeration/run_test.py" -o test/provider_enumeration/run_test.py
          curl -fsSL "$U1/test/provider_enumeration/stubs/Arduino.h" -o test/provider_enumeration/stubs/Arduino.h
          curl -fsSL "$U1/test/provider_enumeration/stubs/freertos/FreeRTOS.h" -o test/provider_enumeration/stubs/freertos/FreeRTOS.h
          curl -fsSL "$U1/test/provider_enumeration/stubs/freertos/task.h" -o test/provider_enumeration/stubs/freertos/task.h
          curl -fsSL "$U1/test/resources/cdc_prepare_performance_test.py" -o test/resources/cdc_prepare_performance_test.py
          curl -fsSL "$U1/test/resources/cdc_sd_stubs/HalStorage.h" -o test/resources/cdc_sd_stubs/HalStorage.h
          curl -fsSL "$U1/test/run_storage_generation_test.sh" -o test/run_storage_generation_test.sh

          curl -fsSL "$NTP/docs/bugfix/BUG-216.md" -o docs/bugfix/BUG-216.md
          curl -fsSL "$NTP/src/ClockSync.cpp" -o src/ClockSync.cpp
          curl -fsSL "$NTP/test/clock_sync/ClockSyncRolloverTest.cpp" -o test/clock_sync/ClockSyncRolloverTest.cpp
          curl -fsSL "$NTP/test/run_clock_sync_retry_test.sh" -o test/run_clock_sync_retry_test.sh

          sed -i -E 's/^version = .*/version = 1.3.92/' platformio.ini
          grep -n '^version' platformio.ini | head -3

          rm -f .github/workflows/fold-387-388.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Fold #387 U1 provider enumeration cache and #388 BUG-216 NTP rollover into rollup #384"
          git push origin HEAD:fix/consolidated-bugs-20261003-c
          echo "Pushed $(git rev-parse HEAD)"
          test -f docs/U1_PROVIDER_ENUMERATION_PERFORMANCE.md
          test -f docs/bugfix/BUG-216.md
          test -f test/clock_sync/ClockSyncRolloverTest.cpp
          test -f test/provider_enumeration/cases.cpp
          grep -q 'version = 1.3.92' platformio.ini
