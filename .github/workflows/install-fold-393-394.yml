name: install-fold-393-394
on:
  push:
    branches: [fix/consolidated-bugs-20261003-c]
    paths:
      - '.github/workflows/install-fold-393-394.yml'
      - '.github/wf-fold.part0'
  workflow_dispatch:
jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consolidated-bugs-20261003-c
          fetch-depth: 0
      - name: Install and run fold workflow payload
        run: |
          set -euo pipefail
          git config user.name "michaelrolphone-cmyk"
          git config user.email "michael.rol.phone@gmail.com"
          test -f .github/wf-fold.part0
          python3 <<'PY'
          import base64
          from pathlib import Path
          parts = sorted(Path('.github').glob('wf-fold.part*'))
          b64 = ''.join(p.read_text().strip() for p in parts)
          Path('.github/workflows/fold-393-394-checkout.yml').write_bytes(base64.b64decode(b64))
          print('installed', Path('.github/workflows/fold-393-394-checkout.yml').stat().st_size)
          PY
          rm -f .github/wf-fold.part* .github/workflows/install-fold-393-394.yml
          git add -A
          git commit -m "temp: install fold-393-394-checkout workflow"
          git push origin HEAD:fix/consolidated-bugs-20261003-c
