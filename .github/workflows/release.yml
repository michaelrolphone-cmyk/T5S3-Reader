name: Cut RiscRTE release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: independent-riscrte-product-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish changed firmware, apps, and drivers
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-
      - name: Install build tools
        run: |
          python -m pip install platformio==6.1.19 pyelftools
          pio pkg install -e t5s3-pro
      - name: Scan source manifests and plan changed releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_updated_packages.py --plan-only --plan-file "$RUNNER_TEMP/release-plan.json"
      - name: Build only planned changed products
        run: python scripts/build_release_candidates.py --plan "$RUNNER_TEMP/release-plan.json"
      - name: Publish planned product releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_updated_packages.py --plan-file "$RUNNER_TEMP/release-plan.json"
