name: Cut RiscRTE release

on:
  push:
    branches: [master]
    paths: ['.github/release-request.json']
  workflow_dispatch:
    inputs:
      tag:
        description: RiscRTE tag to create
        required: true
      commit_firmware:
        description: Commit merged bin into firmware/
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: cut-riscrte-release
  cancel-in-progress: false

jobs:
  request:
    name: Validate RiscRTE release request
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.request.outputs.publish }}
      tag: ${{ steps.request.outputs.tag }}
      ver: ${{ steps.request.outputs.ver }}
      commit_firmware: ${{ steps.request.outputs.commit_firmware }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate request and version
        id: request
        run: python3 scripts/resolve_release_request.py

  release:
    needs: request
    if: ${{ needs.request.outputs.publish == 'true' }}
    name: Build and publish RiscRTE
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        env:
          TAG: ${{ needs.request.outputs.tag }}
          VER: ${{ needs.request.outputs.ver }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "bin=firmware/riscrte_lilygo_t5s3_${VER}.bin" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Build RiscRTE gh_release
        run: pio run -e gh_release
        
      - name: Verify firmware build outputs
        run: |
          set -euo pipefail
      
          echo "Firmware build directory:"
          ls -lah .pio/build/gh_release/ || true
      
          echo "Firmware images:"
          find .pio -type f \( -name 'firmware.bin' -o -name 'firmware-merged.bin' \) -print
      
          test -s .pio/build/gh_release/firmware.bin || {
            echo "::error::Firmware build did not produce firmware.bin"
            exit 1
          }
          
      - name: Verify baked RiscRTE version string
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          BIN=".pio/build/gh_release/firmware.bin"
          if ! grep -a -F -q "$VER" "$BIN"; then
            echo "firmware.bin does not contain RiscRTE version string $VER"
            exit 1
          fi
          if grep -a -F -q -- "-dev-" "$BIN"; then
            echo "firmware.bin still contains a -dev- version string; gh_release must stamp a clean version"
            exit 1
          fi
          echo "Baked RiscRTE version $VER present in firmware.bin"

      - name: Build and validate GPS driver package
        run: |
          python scripts/build_driver.py
          bash test/run_driver_test.sh
          bash test/run_native_app_test.sh dist/drivers/gps-nmea/driver.elf

      - name: Build and validate USB CDC driver package
        run: |
          python scripts/build_usb_cdc_driver.py
          bash test/run_native_app_test.sh dist/drivers/usb-cdc-acm/driver.elf

      - name: Build native ELF apps and manifests
        run: python scripts/build_all_apps.py

      - name: Build real hardware-owning USB providers and canonical packages
        run: |
          python -m pip install pyelftools
          pio pkg install -e t5s3-pro
          python scripts/probe_usb_controller_esp32s3.py --link-experiment
          python scripts/audit_usb_controller_elf.py --strict
          python scripts/probe_i2c_esp32s3_v2.py
          python scripts/audit_i2c_esp32s3_elf.py --strict
          python scripts/build_platform_clock_v1.py
          python scripts/build_board_power_t5s3_v2.py
          python scripts/build_usb_host_v2.py
          python scripts/build_usb_cdc_v2.py
          python scripts/build_usb_cp210x_v2.py
          python scripts/build_installed_usb_stack.py
          python test/drivers/installed_usb_stack_package_test.py
          python scripts/export_canonical_driver_release.py

      - name: Stage RiscRTE firmware image
        run: |
          mkdir -p firmware dist
          cp .pio/build/gh_release/firmware-merged.bin "${{ steps.ver.outputs.bin }}"
          cp .pio/build/gh_release/firmware.bin dist/firmware-t5s3-pro.bin
          cp .pio/build/gh_release/firmware.bin "dist/riscrte_lilygo_t5s3_${{ steps.ver.outputs.ver }}-app.bin"
          cp .pio/build/gh_release/firmware-merged.bin "dist/riscrte_lilygo_t5s3_${{ steps.ver.outputs.ver }}.bin"
          cp .pio/build/gh_release/firmware.elf "dist/riscrte_lilygo_t5s3_${{ steps.ver.outputs.ver }}.elf"
          ls -lh "${{ steps.ver.outputs.bin }}" dist/

      - name: Commit firmware tree
        if: ${{ needs.request.outputs.commit_firmware == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.ver.outputs.bin }}"
          if git diff --cached --quiet; then
            echo "RiscRTE firmware image already committed"
          else
            git commit -m "Add ${{ steps.ver.outputs.bin }}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Create tag
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          else
            git tag -a "$TAG" -m "RiscRTE $TAG"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.ver }}
          MERGED: ${{ steps.ver.outputs.bin }}
        run: |
          set -euo pipefail

          NOTES="RiscRTE ${VER} firmware for the LilyGo T5S3 E-Paper Pro. firmware-t5s3-pro.bin and riscrte_lilygo_t5s3_${VER}-app.bin are OTA/SD app images (0x10000). riscrte_lilygo_t5s3_${VER}.bin is the merged USB image (0x0) and must not be used for SD/OTA. The matching .elf is a non-flashable debug-symbol image retained for decoding panic backtraces. CrossPoint reader functionality is included as the ebook-reader subsystem of RiscRTE."

          mapfile -d '' APP_ELFS < <(
            find dist/apps -type f \( -name '*.elf' -o -name '*.json' \) -print0 | sort -z
          )
          mapfile -d '' CANONICAL_DRIVER_ASSETS < <(
            find dist/release-packages -maxdepth 1 -type f -print0 | sort -z
          )

          ASSETS=(
            "dist/firmware-t5s3-pro.bin"
            "dist/riscrte_lilygo_t5s3_${VER}-app.bin"
            "dist/riscrte_lilygo_t5s3_${VER}.elf"
            "$MERGED"
            "${APP_ELFS[@]}"
            "${CANONICAL_DRIVER_ASSETS[@]}"
            "dist/drivers/driver-catalog.json"
            dist/drivers/*.t5driver.zip
            dist/drivers/*.t5driver.json
            dist/drivers/*.t5driver.elf
          )

          echo "RiscRTE release assets:"
          printf '  %s\n' "${ASSETS[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "${ASSETS[@]}" \
              --clobber
          else
            gh release create "$TAG" \
              "${ASSETS[@]}" \
              --title "RiscRTE ${VER}" \
              --notes "$NOTES"
          fi
