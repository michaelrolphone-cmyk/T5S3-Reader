name: RiscRTE PlatformIO Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/platformio-build.yml"
      - "Apps/**"
      - "Drivers/**"
      - "Services/**"
      - "Providers/**"
      - "sdk/**"
      - "SD_fonts/FAClassic*/**"
      - "src/**"
      - "lib/**"
      - "scripts/**"
      - "examples/native_apps/**"
      - "test/**"
      - "platformio.ini"
      - "platformio.headless.ini"
      - "partitions.csv"
  pull_request:
    paths:
      - ".github/workflows/platformio-build.yml"
      - "Apps/**"
      - "Drivers/**"
      - "Services/**"
      - "Providers/**"
      - "sdk/**"
      - "SD_fonts/FAClassic*/**"
      - "src/**"
      - "lib/**"
      - "scripts/**"
      - "examples/native_apps/**"
      - "test/**"
      - "platformio.ini"
      - "platformio.headless.ini"
      - "partitions.csv"
  workflow_dispatch:

concurrency:
  group: riscrte-platformio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-source-versions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject changed package sources with unchanged versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$HEAD_REF" = "impl/u1-riscrte" ]; then
            python3 scripts/check_changed_package_versions.py --base "$BASE_SHA" --zip-transition
          else
            python3 scripts/check_changed_package_versions.py --base "$BASE_SHA"
          fi

  build:
    name: Build RiscRTE ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: t5s3-pro
            board_id: t5s3-pro
            firmware_name: riscrte-t5s3-pro.bin
            merged_firmware_name: riscrte-t5s3-pro-merged.bin
            elf_name: riscrte-t5s3-pro.elf
          - environment: xteink-x4-pro
            board_id: xteink-x4-pro
            firmware_name: riscrte-xteink-x4-pro.bin
            merged_firmware_name: riscrte-xteink-x4-pro-merged.bin
            elf_name: riscrte-xteink-x4-pro.elf
          - environment: lilygo-epd47-s3
            board_id: lilygo-epd47-s3
            firmware_name: riscrte-lilygo-epd47-s3.bin
            merged_firmware_name: riscrte-lilygo-epd47-s3-merged.bin
            elf_name: riscrte-lilygo-epd47-s3.elf

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19 pyelftools==0.32

      - name: Rebuild X4 provider ELFs and embed them
        run: |
          pio pkg install -e xteink-x4-pro
          export PATH="$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin:$PATH"
          python scripts/build_platform_clock_v1.py
          python scripts/build_x4pro_drivers.py
          python scripts/embed_x4pro_providers.py
          cc -std=c11 -Wall -Wextra -Werror -Wno-int-to-pointer-cast -I Drivers/x4pro_board -o /tmp/x4gpio test/x4pro_gpio_test.c
          /tmp/x4gpio
          cc -std=c11 -Wall -Wextra -Werror -I Drivers/x4pro_board \
            test/x4pro_proto_test.c -o /tmp/x4proto
          /tmp/x4proto
          python3 test/x4pro_boot_isolation_test.py
          python3 test/x4pro_panel_sequence_test.py
          python3 test/x4pro_import_match_test.py
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver -I test/x4pro_panel_fake -I Drivers/x4pro_board \
            test/x4pro_panel_state_test.c Drivers/x4pro_panel/driver.c -o /tmp/x4panel
          /tmp/x4panel
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver -I test/x4pro_sd_fake -I Drivers/x4pro_board \
            test/x4pro_sd_absent_test.c Drivers/x4pro_sd/driver.c -o /tmp/x4sd-absent
          /tmp/x4sd-absent
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver -I test/x4pro_sd_card_fake -I Drivers/x4pro_board \
            test/x4pro_sd_sector_test.c Drivers/x4pro_sd/driver.c -o /tmp/x4sd-sector
          /tmp/x4sd-sector

      - name: Build RiscRTE firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Preserve bounded SDK source-drift diagnostic on build failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: u1-sdk-source-drift-${{ matrix.board_id }}
          path: dist/u1-sdk-source-drift.json
          if-no-files-found: ignore

      - name: Verify the actual pinned SD SPI port fault patch
        run: python3 test/hal/sd_spi_patch_test.py "$HOME/.platformio/packages/framework-arduinoespressif32" ".pio/build/${{ matrix.environment }}/u1-sdk-sources"

      - name: Verify actual runtime sidecar parser and owned app admission
        run: bash test/run_app_manifest_test.sh ".pio/libdeps/${{ matrix.environment }}/ArduinoJson/src"

      - name: Verify actual Arduino HTTP body-loop termination
        run: python3 test/runtime_network/http_client_body_budget_test.py "$HOME/.platformio/packages/framework-arduinoespressif32/libraries/HTTPClient/src/HTTPClient.cpp"
      - name: Record production serial and USB target references
        run: python scripts/report_u1_target_references.py --elf ".pio/build/${{ matrix.environment }}/firmware.elf" --source-head "${{ github.event.pull_request.head.sha || github.sha }}" --profile "${{ matrix.board_id == 'xteink-x4-pro' && 'x4-diagnostic' || 'firmware' }}" --output "dist/u1-target-references-${{ matrix.board_id }}.json"
      - name: Preserve compact target reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: u1-target-references-${{ matrix.board_id }}
          path: dist/u1-target-references-${{ matrix.board_id }}.json
          if-no-files-found: error

      - name: Build and validate native ELFs
        run: |
          python scripts/build_native_app.py examples/native_apps/hello.c --output /tmp/riscrte-native-app-hello.elf
          bash test/run_native_app_test.sh /tmp/riscrte-native-app-hello.elf
          python scripts/build_native_app.py Apps/timecard.c --output dist/timecard.elf
          bash test/run_native_app_test.sh dist/timecard.elf

      - name: Build and validate installable GPS driver
        run: |
          python scripts/build_driver.py
          bash test/run_native_app_test.sh dist/drivers/gps-nmea/driver.elf

      - name: Build and validate installable USB CDC driver
        run: |
          python scripts/build_usb_cdc_v2.py
          bash test/run_native_app_test.sh dist/experimental/usb-cdc-acm/driver.elf

      - name: Build and validate all released apps and manifests
        run: |
          python scripts/build_all_apps.py --export-bundles
          python test/native_apps/risc_strike_release_test.py

      - name: Measure verification work on actual built app pairs
        run: |
          bash test/run_app_manifest_test.sh ".pio/libdeps/${{ matrix.environment }}/ArduinoJson/src" dist/apps "dist/u1-app-verification-work-${{ matrix.board_id }}.json"
          python3 scripts/stamp_u1_app_work_report.py "dist/u1-app-verification-work-${{ matrix.board_id }}.json" dist/apps "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Preserve compact app verification work evidence
        uses: actions/upload-artifact@v4
        with:
          name: u1-app-verification-work-${{ matrix.board_id }}
          path: dist/u1-app-verification-work-${{ matrix.board_id }}.json
          if-no-files-found: error

      - name: Stage board-qualified RiscRTE firmware
        run: |
          grep -a -q "RISCRTE_BOARD_ID:${{ matrix.board_id }}" ".pio/build/${{ matrix.environment }}/firmware.bin"
          mkdir -p dist
          cp ".pio/build/${{ matrix.environment }}/firmware.bin" "dist/${{ matrix.firmware_name }}"
          cp ".pio/build/${{ matrix.environment }}/firmware-merged.bin" "dist/${{ matrix.merged_firmware_name }}"
          cp ".pio/build/${{ matrix.environment }}/firmware.elf" "dist/${{ matrix.elf_name }}"

      - name: Upload RiscRTE firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: riscrte-firmware-${{ matrix.board_id }}
          path: |
            dist/${{ matrix.firmware_name }}
            dist/${{ matrix.merged_firmware_name }}
            dist/${{ matrix.elf_name }}
            dist/apps/*
            dist/release-app-packages/*
            dist/drivers/*.t5driver.zip
            dist/timecard.elf
            dist/timecard.json
          if-no-files-found: error

  headless-core-check:
    name: Build ESP32-S3 headless core checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build core checkpoint
        run: pio run -c platformio.headless.ini

  host-tests:
    name: RiscRTE host parser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify target reference report decoding
        run: python3 test/resources/target_reference_report_test.py

      - name: Verify approved SD SPI retained-fault behavior
        run: bash test/run_sd_spi_fault_test.sh

      - name: Verify storage generations and retained inventory
        run: bash test/run_storage_generation_test.sh

      - name: Verify lab target and partition guards
        run: python3 -B test/lab/test_esp32_lab.py

      - name: Verify boot animation choreography
        run: python3 test/boot_animation_contract_test.py

      - name: Verify X4 boot, panel and button contracts
        run: |
          python3 test/x4pro_boot_isolation_test.py
          python3 test/x4pro_panel_sequence_test.py
          cc -std=c11 -Wall -Wextra -Werror -Wno-int-to-pointer-cast -I Drivers/x4pro_board -o /tmp/x4gpio test/x4pro_gpio_test.c
          /tmp/x4gpio
          cc -std=c11 -Wall -Wextra -Werror -I sdk/driver -I test/x4pro_buttons_fake -I Drivers/x4pro_board \
            test/x4pro_buttons_state_test.c Drivers/x4pro_buttons/driver.c -o /tmp/x4buttons
          /tmp/x4buttons
          c++ -std=c++17 -Wall -Wextra -Werror -I src -I sdk/driver \
            test/x4_txt_session_test.cpp -o /tmp/x4txtsession
          /tmp/x4txtsession

      - name: Verify Home reading card rendering and cache behavior
        run: python3 test/home_reading_card_test.py

      - name: Verify idle clock and USB input-power telemetry
        run: bash test/run_idle_power_test.sh

      - name: Verify SD file lifetime synchronization
        run: python3 test/hal/storage_file_lifetime_test.py

      - name: Run streaming JSON parser tests
        run: bash test/run_streaming_json_parser_test.sh

      - name: Run release JSON parser tests
        run: bash test/run_release_json_parser_test.sh

      - name: Run desk clock minute alignment tests
        run: bash test/run_desk_clock_test.sh

      - name: Run driver module and package tests
        run: bash test/run_driver_test.sh

      - name: Run stream runtime tests
        run: bash test/run_stream_test.sh

      - name: Run runtime network provider tests
        run: bash test/run_runtime_network_test.sh

      - name: Verify Wi-Fi credential persistence failure handling
        run: |
          python3 test/native_apps/wifi_credential_persistence_test.py
          bash test/run_wifi_credential_store_fault_test.sh

      - name: Run native app launcher tests
        timeout-minutes: 10
        run: bash test/run_native_app_test.sh

      - name: Verify display abstraction contract
        run: python3 test/native_apps/display_abstraction_contract_test.py

      - name: Exercise display surface and provider adapter contracts
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Ilib/DisplaySurface \
            test/display/display_surface_validation_test.cpp -o /tmp/display-surface-validation
          /tmp/display-surface-validation
          c++ -std=c++17 -Wall -Wextra -Werror -I. -Ilib/DisplaySurface -Isdk/driver \
            test/display/provider_display_surface_test.cpp -o /tmp/provider-display-surface
          /tmp/provider-display-surface

      - name: Run app manifest and springboard tests
        run: bash test/run_springboard_test.sh

      - name: Run Font Awesome tests with shipped SD fonts
        run: bash test/run_fontawesome_test.sh

      - name: Run release index and GameBoy provider tests
        run: |
          python3 test/release_index_test.py
          python3 test/product_release_test.py
          python3 test/release_plan_verification_test.py
          python3 test/bulk_release_test.py
          python3 test/release_workflow_trigger_test.py
          python3 test/sync_gameboy_app_test.py
