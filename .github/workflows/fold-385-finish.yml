name: fold-385-finish
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consolidated-bugs-20261003-c
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull exact #385 Epub.cpp and CssParser.cpp
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/michaelrolphone-cmyk/T5S3-Reader/43b2a97c518b33d22055f752b3387fe24dba02ce"
          curl -fsSL "$BASE/lib/Epub/Epub.cpp" -o lib/Epub/Epub.cpp
          curl -fsSL "$BASE/lib/Epub/Epub/css/CssParser.cpp" -o lib/Epub/Epub/css/CssParser.cpp
          rm -f .fold-encoding-probe.txt .fold-size-probe.txt .fold-size-probe-15k.txt .fold-size-probe-25k.txt || true
          git config user.name "michaelrolphone-cmyk"
          git config user.email "michael.rol.phone@gmail.com"
          git add lib/Epub/Epub.cpp lib/Epub/Epub/css/CssParser.cpp
          git add -u .fold-encoding-probe.txt .fold-size-probe.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
Fold #385: wire Epub.cpp and CssParser to rendition_v1 cache paths

Completes BUG-247 fold into rollup #384 using exact blobs from provenance 43b2a97c518b33d22055f752b3387fe24dba02ce.
EOF
)"
          git push origin HEAD:fix/consolidated-bugs-20261003-c
