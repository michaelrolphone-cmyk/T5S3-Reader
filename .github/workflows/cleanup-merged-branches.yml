name: Cleanup merged branches

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview eligible branches without deleting them
        type: boolean
        default: true
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    name: Audit and clean redundant merged branches
    runs-on: ubuntu-latest
    steps:
      - name: Check open PRs, merged PRs, protection and unique commits
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const dryRun = '${{ inputs.dry_run }}' !== 'false';
            const repository = (await github.rest.repos.get({ owner, repo })).data;
            const defaultBranch = repository.default_branch;
            const pulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'all', per_page: 100 });
            const localHead = pr => pr.head.repo?.full_name === `${owner}/${repo}` ? pr.head.ref : null;
            const inUse = new Set([defaultBranch]);
            const merged = new Set();
            for (const pr of pulls) {
              if (pr.state === 'open') {
                const head = localHead(pr);
                if (head) inUse.add(head);
                inUse.add(pr.base.ref);
              }
              if (pr.merged_at) {
                const head = localHead(pr);
                if (head) merged.add(head);
              }
            }
            const branches = await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 });
            let eligible = 0;
            let deleted = 0;
            for (const branch of branches) {
              const name = branch.name;
              if (inUse.has(name) || branch.protected || !merged.has(name)) {
                core.info(`KEEP ${name}: default/open PR/protected/not a merged PR head`);
                continue;
              }
              try {
                // base=master, head=branch: ahead_by counts commits unique to the branch.
                const comparison = (await github.rest.repos.compareCommits({ owner, repo, base: defaultBranch, head: name })).data;
                if (comparison.ahead_by !== 0) {
                  core.info(`KEEP ${name}: ${comparison.ahead_by} unique commits`);
                  continue;
                }
                // Recheck the ref to avoid deleting a branch that changed during the audit.
                const current = (await github.rest.git.getRef({ owner, repo, ref: `heads/${name}` })).data;
                if (current.object.sha !== branch.commit.sha) {
                  core.warning(`SKIP ${name}: branch advanced during audit`);
                  continue;
                }
                eligible++;
                if (dryRun) {
                  core.info(`DRY RUN ${name}: merged PR head, no unique commits`);
                } else {
                  const refreshed = (await github.rest.repos.compareCommits({ owner, repo, base: defaultBranch, head: name })).data;
                  if (refreshed.ahead_by !== 0) {
                    core.warning(`SKIP ${name}: acquired unique commits`);
                    continue;
                  }
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${name}` });
                  core.info(`DELETED ${name}`);
                  deleted++;
                }
              } catch (error) {
                core.warning(`SKIP ${name}: ${error.message}`);
              }
            }
            await core.summary.addHeading('Merged branch cleanup')
              .addRaw(`Mode: ${dryRun ? 'dry run' : 'delete'}; eligible: ${eligible}; deleted: ${deleted}; default: ${defaultBranch}.`)
              .write();