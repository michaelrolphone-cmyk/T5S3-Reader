name: One-time module-specific ELF relocation guard patch
on:
  push:
    branches:
      - feature/usb-elf-provider-migration
    paths:
      - .github/workflows/privileged-relocation-one-shot.yml
permissions:
  contents: write
jobs:
  apply-reviewed-guard:
    if: github.repository == 'michaelrolphone-cmyk/T5S3-Reader' && github.ref == 'refs/heads/feature/usb-elf-provider-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/usb-elf-provider-migration
          fetch-depth: 2
          persist-credentials: true
      - name: Pin reviewed parent, patch only loader and run focused tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1de343c1f95765faae0773665f8c3947c820de60"
          python scripts/apply_privileged_module_guard_once.py
          python test/drivers/privileged_relocation_entry_v1_test.py
          bash test/run_privileged_os_cpu_v1_test.sh
          git diff --check
          git diff --quiet -- . ':!lib/elf_loader/src/esp_elf.c'
          test -n "$(git diff -- lib/elf_loader/src/esp_elf.c)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lib/elf_loader/src/esp_elf.c
          git commit -m 'Enforce one-shot module-specific ELF relocation guard'
          git push origin HEAD:refs/heads/feature/usb-elf-provider-migration
