name: X4 hardware candidate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Controller, X4 and unchanged CAM host contracts
        run: |
          python -m unittest discover -s test/hardware -p 'test_*.py' -v
          python -m unittest discover -s test/hardware/cam -p 'test_trusted_controller.py' -v
          c++ -std=c++17 -Wall -Wextra -Werror test/hardware/reader/stage_protocol_test.cpp -o /tmp/reader-stage-protocol
          /tmp/reader-stage-protocol
  x4-candidate:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Detect separately owned X4 firmware support
        id: support
        run: |
          if grep -q '^\[env:xteink-x4-pro\]' platformio.ini; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'X4 firmware environment absent on this head. No X4 candidate or hardware qualification produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build exact X4 application
        if: steps.support.outputs.available == 'true'
        run: |
          python -m pip install platformio==6.1.19 pyelftools==0.32 intelhex==2.3.0
          pio pkg install -e xteink-x4-pro
          bash test/hardware/x4/install_ci_toolchain.sh
          export X4_ELF_TOOLCHAIN="$RUNNER_TEMP/x4-elf-toolchain/xtensa-esp-elf/bin"
          bash test/hardware/x4/build_candidate.sh
      - name: Freeze X4 provenance and target-specific manifest
        if: steps.support.outputs.available == 'true'
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/x4-candidate"
          cp .pio/build/xteink-x4-pro/firmware.bin "$RUNNER_TEMP/x4-candidate/riscrte-xteink-x4-pro.bin"
          python test/hardware/x4/contract.py "$RUNNER_TEMP/x4-candidate" "$SOURCE_SHA" "$RUN_ID" "$RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        if: steps.support.outputs.available == 'true'
        with:
          name: x4-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/x4-candidate/
          retention-days: 7
          if-no-files-found: error
