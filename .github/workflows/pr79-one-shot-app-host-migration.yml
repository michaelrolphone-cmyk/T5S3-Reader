name: PR79 one-shot canonical app-host migration
on:
  push:
    branches:
      - feature/unified-manager-driver-adapter
    paths:
      - scripts/pr79_migrate_native_app_host.py
      - .github/workflows/pr79-one-shot-app-host-migration.yml
permissions:
  contents: write
jobs:
  apply-source-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-manager-driver-adapter
          persist-credentials: true
      - name: Patch the real source and preserve its original functionality
        run: |
          python scripts/pr79_migrate_native_app_host.py --write
          python - <<'PY'
          from pathlib import Path
          path = Path('src/native/NativeAppHost.cpp')
          source = path.read_text(encoding='utf-8')
          start = source.index('  if (!canonicalRoot.empty() &&\n      !RuntimePackages::systemPackageUseGate().pin(canonicalRoot.c_str())) {')
          end = source.index('  nativeStreamsBegin();', start)
          source = source[:start] + source[end:]
          marker = '  HalPowerManager::Lock powerLock;'
          assert source.count(marker) == 1
          source = source.replace(marker, '''  // Refuse a concurrent managed-package replacement before changing app UI
          // state. Keep failed dlclose generations pinned for safe recovery.
          if (!canonicalRoot.empty() &&
              !RuntimePackages::systemPackageUseGate().pin(canonicalRoot.c_str())) {
            lastLaunchError = "Managed application is being replaced or is unavailable.";
            return ESP_ERR_INVALID_STATE;
          }
          HalPowerManager::Lock powerLock;''', 1)
          assert 'nativeSystemUiEnd()' not in source
          path.write_text(source, encoding='utf-8')
          PY
          git diff --check
          git diff -- src/native/NativeAppHost.cpp
      - name: Commit actual migrated C++ source on the PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/native/NativeAppHost.cpp
          git commit -m 'Wire canonical package inventory and execution into native App Store launcher'
          git push origin HEAD:feature/unified-manager-driver-adapter
