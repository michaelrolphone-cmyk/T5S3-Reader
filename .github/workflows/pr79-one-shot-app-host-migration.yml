name: PR79 apply canonical online App Store integration
on:
  push:
    branches:
      - feature/unified-manager-driver-adapter
    paths:
      - scripts/pr79_wire_online_app_install.py
      - .github/workflows/pr79-one-shot-app-host-migration.yml
permissions:
  contents: write
jobs:
  integrate-app-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-manager-driver-adapter
          persist-credentials: true
      - name: Apply canonical transaction to actual native App Store source
        run: |
          python scripts/pr79_wire_online_app_install.py
          git diff --check
          git diff -- src/native/NativeAppHost.cpp
      - name: Commit integrated C++ implementation to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/native/NativeAppHost.cpp
          if ! git diff --cached --quiet; then
            git commit -m 'Route online App Store installs through unified canonical package transaction'
            git push origin HEAD:feature/unified-manager-driver-adapter
          fi
