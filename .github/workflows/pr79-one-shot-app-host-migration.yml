name: PR79 apply canonical manager source integration
on:
  push:
    branches:
      - feature/unified-manager-driver-adapter
    paths:
      - scripts/pr79_wire_online_app_install.py
      - scripts/pr79_wire_online_driver_manager.py
      - scripts/pr79_wire_release_delivery.py
      - .github/workflows/pr79-one-shot-app-host-migration.yml
permissions:
  contents: write
jobs:
  integrate-managers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-manager-driver-adapter
          persist-credentials: true
      - name: Edit actual firmware source and future release delivery
        run: |
          python scripts/pr79_wire_online_app_install.py
          python scripts/pr79_wire_online_driver_manager.py
          python scripts/pr79_wire_release_delivery.py
          git diff --check
          git diff -- src/native/NativeAppHost.cpp src/native/NativeDriverManagerBridge.cpp .github/workflows/release.yml
      - name: Commit integrated C++ and release sources to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/native/NativeAppHost.cpp src/native/NativeDriverManagerBridge.cpp .github/workflows/release.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate canonical App Store, physical driver catalog and release delivery'
            git push origin HEAD:feature/unified-manager-driver-adapter
          fi
