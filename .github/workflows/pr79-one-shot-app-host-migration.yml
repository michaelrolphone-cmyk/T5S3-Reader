name: PR79 apply canonical manager source integration
on:
  push:
    branches:
      - feature/unified-manager-driver-adapter
    paths:
      - scripts/pr79_wire_online_app_install.py
      - scripts/pr79_wire_online_driver_manager.py
      - scripts/pr79_enforce_streamed_intake.py
      - scripts/pr79_driver_dependency_install.py
      - scripts/pr79_fix_catalog_array_api.py
      - scripts/pr79_fix_driver_recovery_cancel.py
      - scripts/pr79_fix_driver_inbox_name_bounds.py
      - scripts/pr79_align_release_versions.py
      - scripts/pr79_fix_recovery_host_test.py
      - .github/workflows/pr79-one-shot-app-host-migration.yml
permissions:
  contents: write
jobs:
  integrate-managers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-manager-driver-adapter
          persist-credentials: true
      - name: Apply manager integration and fix recovery host-test event sequence
        run: |
          python scripts/pr79_wire_online_app_install.py
          python scripts/pr79_wire_online_driver_manager.py
          python scripts/pr79_driver_dependency_install.py
          python scripts/pr79_enforce_streamed_intake.py
          python scripts/pr79_fix_catalog_array_api.py
          python scripts/pr79_fix_driver_recovery_cancel.py
          python scripts/pr79_fix_driver_inbox_name_bounds.py
          python scripts/pr79_align_release_versions.py
          python scripts/pr79_fix_recovery_host_test.py
          git diff --check
          git diff -- src/native/NativeAppHost.cpp src/native/NativeDriverManagerBridge.cpp src/native/NativeOnlineAppInstall.h src/native/NativeOnlineDriverInstall.h Apps/driver_manager.c platformio.ini Apps/app_store.json Apps/driver_manager.json Apps/serial_monitor.json test/native_apps/driver_manager_test.c
      - name: Compile and run actual Driver Manager recovery and app regression tests
        run: bash test/run_springboard_test.sh
      - name: Commit verified source and regression correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/native/NativeAppHost.cpp src/native/NativeDriverManagerBridge.cpp src/native/NativeOnlineAppInstall.h src/native/NativeOnlineDriverInstall.h Apps/driver_manager.c platformio.ini Apps/app_store.json Apps/driver_manager.json Apps/serial_monitor.json test/native_apps/driver_manager_test.c
          if ! git diff --cached --quiet; then
            git commit -m 'Correct Driver Manager recovery host test for nested Back semantics'
            git pull --rebase origin feature/unified-manager-driver-adapter
            git push origin HEAD:feature/unified-manager-driver-adapter
          fi
