name: PR79 apply canonical manager source integration
on:
  push:
    branches:
      - feature/unified-manager-driver-adapter
    paths:
      - scripts/pr79_wire_online_app_install.py
      - scripts/pr79_wire_online_driver_manager.py
      - scripts/pr79_enforce_streamed_intake.py
      - scripts/pr79_driver_dependency_install.py
      - .github/workflows/pr79-one-shot-app-host-migration.yml
permissions:
  contents: write
jobs:
  integrate-managers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-manager-driver-adapter
          persist-credentials: true
      - name: Apply actual manager, dependency and stream source integrations
        run: |
          python scripts/pr79_wire_online_app_install.py
          python scripts/pr79_wire_online_driver_manager.py
          python scripts/pr79_driver_dependency_install.py
          python scripts/pr79_enforce_streamed_intake.py
          git diff --check
          git diff -- src/native/NativeAppHost.cpp src/native/NativeDriverManagerBridge.cpp src/native/NativeOnlineAppInstall.h src/native/NativeOnlineDriverInstall.h
      - name: Commit firmware source only (workflow edits require separate owner-authorized write)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/native/NativeAppHost.cpp src/native/NativeDriverManagerBridge.cpp src/native/NativeOnlineAppInstall.h src/native/NativeOnlineDriverInstall.h
          if ! git diff --cached --quiet; then
            git commit -m 'Complete canonical manager dependency graph and streamed installs'
            git push origin HEAD:feature/unified-manager-driver-adapter
          fi
