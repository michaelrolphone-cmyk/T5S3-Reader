name: Fold 405 apply
on:
  push:
    branches: [fix/consolidated-bugs-20261003-c]
    paths:
      - '.github/workflows/fold-405-apply.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consolidated-bugs-20261003-c
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply remaining #405 fold pieces
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if grep -q 'emittedAny' src/network/CrossPointWebServer.cpp \
             && grep -q 'opds_response/response_test.py' .github/workflows/platformio-build.yml \
             && grep -q 'version = 1.3.115' platformio.ini; then
            echo "Core fold already present; cleanup helpers"
            rm -f .github/workflows/fold-405-simple.yml .github/workflows/fold-405-apply.yml
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "temp: cleanup fold-405 helper workflows"
              git push origin HEAD:fix/consolidated-bugs-20261003-c
            fi
            exit 0
          fi

          python3 scripts/fold_405_apply.py

          git fetch origin fix/bug142-opds-json-separators
          git checkout 533275e444f32fe1e665a72a6aa1c0fa903e4a49 -- test/opds_response/response_test.cpp

          grep -q 'emittedAny' src/network/CrossPointWebServer.cpp
          grep -q 'opds_response/response_test.py' .github/workflows/platformio-build.yml
          grep -q 'opds_reload/reload_test.py' .github/workflows/platformio-build.yml
          grep -q 'version = 1.3.115' platformio.ini
          test -f docs/bugfix/BUG-142.md
          test -f test/opds_response/response_test.py

          rm -f .github/workflows/fold-405-simple.yml .github/workflows/fold-405-apply.yml scripts/fold_405_apply.py
          git add -A
          git commit -m "Fold #405 BUG-142 into rollup (firmware 1.3.115)"
          git push origin HEAD:fix/consolidated-bugs-20261003-c
          echo "Pushed $(git rev-parse HEAD)"
