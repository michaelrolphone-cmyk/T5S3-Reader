name: Fold 399 into rollup
on:
  workflow_dispatch:
  push:
    branches: [fix/consolidated-bugs-20261003-c]
    paths:
      - '.github/workflows/fold-399.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consolidated-bugs-20261003-c
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fold #399 BUG-35
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if grep -q 'Failed to save migrated language settings' src/CrossPointSettings.cpp \
             && grep -q 'version = 1.3.109' platformio.ini \
             && test -f docs/bugfix/BUG-35.md \
             && test -f test/run_language_migration_test.sh \
             && grep -q 'run_language_migration_test.sh' test/run_springboard_test.sh; then
            echo "BUG-35 already on rollup; cleaning workflow only"
            rm -f .github/workflows/fold-399.yml
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "temp: remove fold-399 one-shot workflow"
              git push origin HEAD:fix/consolidated-bugs-20261003-c
            fi
            exit 0
          fi

          git fetch origin fix/bug35-preserve-language-migration-source
          SRC=bc24381632c11b3608695ddbb85ae686ec096df6

          git checkout "$SRC" -- \
            docs/bugfix/BUG-35.md \
            test/language_migration/stubs/Arduino.h \
            test/language_migration/stubs/HalStorage.h \
            test/language_migration/stubs/Logging.h \
            test/language_migration/test.cpp \
            test/run_language_migration_test.sh

          python3 - <<'PY'
          import re
          from pathlib import Path
          import subprocess
          src = subprocess.check_output(
              ["git", "show", "bc24381632c11b3608695ddbb85ae686ec096df6:src/CrossPointSettings.cpp"],
              text=True,
          )
          rollup = Path("src/CrossPointSettings.cpp").read_text()
          m = re.search(r"bool CrossPointSettings::migrateLanguageBinaryFile\(\) \{.*?\n\}\n", src, re.S)
          assert m, "missing fixed migrate in source"
          m2 = re.search(r"bool CrossPointSettings::migrateLanguageBinaryFile\(\) \{.*?\n\}\n", rollup, re.S)
          assert m2, "missing migrate in rollup"
          Path("src/CrossPointSettings.cpp").write_text(rollup[: m2.start()] + m.group(0) + rollup[m2.end() :])
          text = Path("src/CrossPointSettings.cpp").read_text()
          assert "Failed to save migrated language settings" in text
          assert "Storage.rename(LANG_FILE_BIN, LANG_FILE_BAK);\n  saveToFile();" not in text
          print("CrossPointSettings migrateLanguageBinaryFile patched")
          PY

          sed -i -E 's/^version = 1\.3\.[0-9]+$/version = 1.3.109/' platformio.ini
          grep -q 'version = 1.3.109' platformio.ini

          python3 - <<'PY'
          from pathlib import Path
          p = Path("test/run_springboard_test.sh")
          text = p.read_text()
          if "run_language_migration_test.sh" not in text:
              needle = 'python3 "$repo_dir/test/recent_books/migration_test.py" --sanitize\n'
              assert needle in text, "recent_books anchor missing"
              insert = needle + 'SANITIZE=1 bash "$repo_dir/test/run_language_migration_test.sh"\n'
              p.write_text(text.replace(needle, insert, 1))
          assert "run_language_migration_test.sh" in p.read_text()
          print("springboard wired")
          PY

          chmod +x test/run_language_migration_test.sh
          bash test/run_language_migration_test.sh

          rm -f .github/workflows/fold-399.yml
          git add -A
          git status
          git commit -m "Fold #399 BUG-35: preserve language settings when legacy migration fails (firmware 1.3.109)"
          git push origin HEAD:fix/consolidated-bugs-20261003-c
          echo "Pushed $(git rev-parse HEAD)"
